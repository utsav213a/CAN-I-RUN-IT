# Render Blueprint: deploys this app as a web service.
# In Render: New > Blueprint > connect your GitHub repository.
services:
  - type: web
    name: can-i-run-it
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: 0.0.0.0
      - key: AFFILIATE_TAG
        value: YOUR-AFFILIATE-TAG
